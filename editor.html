<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>echarts-flow 流程图编辑器</title>
    <link rel="stylesheet" href="./shared/site.css" />
    <link rel="stylesheet" href="./demo/demo.css" />
  </head>
  <body>
    <header data-site-header></header>
    <header class="flow-demo__toolbar">
      <div class="flow-demo__group" aria-label="添加节点" data-i18n-attr="aria-label:groupAdd">
        <button class="flow-demo__button" type="button" data-shape="start" data-i18n="btnStart">开始</button>
        <button class="flow-demo__button" type="button" data-shape="process" data-i18n="btnProcess">处理</button>
        <button class="flow-demo__button" type="button" data-shape="decision" data-i18n="btnDecision">判断</button>
        <button class="flow-demo__button" type="button" data-shape="io" data-i18n="btnIo">输入/输出</button>
        <button class="flow-demo__button" type="button" data-shape="end" data-i18n="btnEnd">结束</button>
      </div>
      <div class="flow-demo__group" aria-label="编辑" data-i18n-attr="aria-label:groupEdit">
        <button class="flow-demo__button" id="undo-button" type="button" data-action="undo" data-i18n="btnUndo">撤销</button>
        <button class="flow-demo__button" id="redo-button" type="button" data-action="redo" data-i18n="btnRedo">重做</button>
        <button class="flow-demo__button" type="button" data-action="delete" data-i18n="btnDelete">删除</button>
      </div>
      <div class="flow-demo__group" aria-label="视图" data-i18n-attr="aria-label:groupView">
        <button class="flow-demo__button" type="button" data-action="layout" data-i18n="btnLayout">自动布局</button>
        <button class="flow-demo__button" type="button" data-action="fit" data-i18n="btnFit">适应画布</button>
        <button class="flow-demo__button" type="button" data-action="zoom-in" data-i18n="btnZoomIn">放大</button>
        <button class="flow-demo__button" type="button" data-action="zoom-out" data-i18n="btnZoomOut">缩小</button>
      </div>
      <div class="flow-demo__group" aria-label="模式" data-i18n-attr="aria-label:groupMode">
        <button class="flow-demo__button" type="button" data-action="simulate" data-i18n="btnSimulate">模拟运行</button>
        <label class="flow-demo__toggle"><input id="editable-toggle" type="checkbox" checked /><span data-i18n="labelEditable"> 可编辑</span></label>
        <label class="flow-demo__toggle"><span data-i18n="labelTheme"> 主题 </span><select id="theme-select">
            <option value="light">light</option>
            <option value="dark">dark</option>
            <option value="macarons">macarons</option>
            <option value="tech-blue">tech-blue</option>
            <option value="aurora">aurora</option>
            <option value="aurora-dark">aurora-dark</option>
            <option value="whiteboard">whiteboard</option>
            <option value="classic">classic</option>
          </select></label>
        <label class="flow-demo__toggle"><span data-i18n="labelRenderer"> 渲染器 </span><select id="renderer-select">
            <option value="canvas">Canvas</option>
            <option value="svg">SVG</option>
          </select></label>
      </div>
    </header>
    <main class="flow-demo__body">
      <section class="flow-demo__canvas" id="flow-chart"></section>
      <aside class="flow-demo__panel">
        <h2 class="flow-demo__title" data-i18n="panelTitle">操作说明</h2>
        <ul class="flow-demo__tips">
          <li data-i18n="tip1">拖动节点移动，Shift 点击多选，Shift 拖空白处框选</li>
          <li data-i18n="tip2">悬停节点后从圆点拖出连线；选中连线后拖两端圆点改接</li>
          <li data-i18n="tip3">双击节点或连线编辑文字</li>
          <li data-i18n="tip4">Delete 删除，Ctrl/Cmd+Z 撤销，Ctrl/Cmd+C / V / D 复制粘贴，方向键微调</li>
          <li data-i18n="tip5">拖动空白处平移，滚轮缩放</li>
        </ul>
        <a class="flow-demo__link" href="./test/cases/index.html" data-i18n="casesLink">查看全部 17 个用例 →</a>
        <h2 class="flow-demo__title" data-i18n="panelData">数据</h2>
        <pre class="flow-demo__json" id="graph-json"></pre>
      </aside>
    </main>
    <script type="module" src="./demo/main.ts"></script>
  </body>
</html>
