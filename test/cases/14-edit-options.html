<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>14 编辑配置项与 API - echarts-flow</title>
    <link rel="stylesheet" href="./shared/cases.css" />
  </head>
  <body>
    <nav class="case__nav"><a href="./index.html" data-i18n="backToList">← 用例列表</a><span class="case__nav-actions"><span data-lang-switch></span></span></nav>
    <h1 class="case__title" data-i18n="title">14 编辑配置项与 API</h1>
    <p class="case__desc" data-i18n-html="desc">
      编辑能力由 <code>edit</code> 配置项控制（构造时传入），运行时用 <code>editor.setEditOptions(patch)</code> 修改、
      <code>editor.getEditOptions()</code> 读取。右侧每个开关都直接调用 <code>setEditOptions</code>。
      这些开关只限制用户的鼠标和键盘操作，API 调用不受影响；<code>validateConnection</code>、<code>beforeDelete</code>
      和节点/连线的 <code>isLocked</code> 是数据规则，对用户操作和 API 都生效。
    </p>
    <div class="case__toolbar">
      <span class="case__label" data-i18n="labelPreset">预设</span>
      <button class="case__button" type="button" data-preset="all" data-i18n="btnPresetAll">全部可编辑</button>
      <button class="case__button" type="button" data-preset="readonly" data-i18n="btnPresetReadonly">只读（可平移缩放）</button>
      <button class="case__button" type="button" data-preset="static" data-i18n="btnPresetStatic">完全静态</button>
      <button class="case__button" type="button" data-preset="connect-only" data-i18n="btnPresetConnect">只能连线</button>
      <button class="case__button" type="button" data-preset="move-only" data-i18n="btnPresetMove">只能拖动</button>
      <span class="case__label">API</span>
      <button class="case__button" id="lock-button" type="button" data-i18n="btnLock">锁定/解锁所选</button>
      <button class="case__button" id="api-connect-button" type="button" data-i18n="btnApiConnect">API 连线 审批 → 开始</button>
      <button class="case__button" id="api-delete-button" type="button" data-i18n="btnApiDelete">API 删除所选</button>
      <label><span data-i18n="labelZoom">缩放 </span><input id="zoom-range" type="range" min="10" max="400" value="100" /></label>
    </div>
    <div class="case__layout">
      <section class="case__chart" id="chart"></section>
      <aside class="case__side">
        <span class="case__label" data-i18n="labelFlags">编辑开关</span>
        <div class="case__options" id="flag-list"></div>
        <span class="case__label" data-i18n="labelNumbers">数值</span>
        <div class="case__options" id="number-list"></div>
        <label><span data-i18n="labelBlankDrag"> blankDragAction（拖空白处，按住 Shift 切换为另一种） </span><select id="blank-drag-select">
            <option value="pan" data-i18n="optionPan">pan：平移画布</option>
            <option value="boxSelect" data-i18n="optionBoxSelect">boxSelect：框选</option>
          </select>
        </label>
        <span class="case__label" data-i18n="labelRules">数据规则</span>
        <label><input id="rule-connection" type="checkbox" checked /><span data-i18n="labelRuleConnection"> validateConnection：不能连向"开始"，判断最多 2 条出边</span></label>
        <label><input id="rule-delete" type="checkbox" checked /><span data-i18n="labelRuleDelete"> beforeDelete：删除前确认</span></label>
        <span class="case__label" data-i18n="labelLog">日志</span>
        <pre class="case__log case__log--short" id="log"></pre>
      </aside>
    </div>
    <script type="module" src="./edit-options.ts"></script>
  </body>
</html>
