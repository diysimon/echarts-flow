<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>12 样式配置大全 - echarts-flow</title>
    <link rel="stylesheet" href="./shared/cases.css" />
  </head>
  <body>
    <nav class="case__nav"><a href="./index.html">← 用例列表</a></nav>
    <h1 class="case__title">12 样式配置大全</h1>
    <p class="case__desc">
      逐项展示可配置的样式：11 种节点形状；8 种箭头（可用在起点和终点）；3 种连线方式（正交、直线、曲线，含回边）；
      连线样式（虚线、线宽、颜色、透明度、圆角、标签配色）；节点样式覆盖（填充、描边、虚线边框、字号字重、圆角、透明度、阴影）。
      上方的主题切换说明这些覆盖叠加在主题之上，"自定义主题"是用 <code>createFlowTheme</code> 在 light 上改出来的。
    </p>
    <div class="case__toolbar">
      <label>
        主题
        <select id="theme-select">
          <option value="light">light</option>
          <option value="aurora">aurora</option>
          <option value="aurora-dark">aurora-dark</option>
          <option value="custom">自定义主题（createFlowTheme）</option>
          <option value="whiteboard">whiteboard</option>
          <option value="classic">classic</option>
          <option value="dark">dark</option>
          <option value="tech-blue">tech-blue</option>
          <option value="macarons">macarons</option>
        </select>
      </label>
      <button class="case__button" id="fit-button" type="button">适应画布</button>
    </div>
    <section class="case__chart case__chart--tall" id="chart"></section>
    <script type="module" src="./style-gallery.ts"></script>
  </body>
</html>
