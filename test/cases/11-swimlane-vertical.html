<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>11 竖向泳道（经典风格）- echarts-flow</title>
    <link rel="stylesheet" href="./shared/cases.css" />
  </head>
  <body>
    <nav class="case__nav"><a href="./index.html" data-i18n="backToList">← 用例列表</a><span class="case__nav-actions"><span data-lang-switch></span></span></nav>
    <h1 class="case__title" data-i18n="title">11 竖向泳道（经典风格）</h1>
    <p class="case__desc" data-i18n-html="desc">
      仿"软件产品设计研发流程图"：<code>direction: 'TB'</code> 时泳道是竖排的列，表头在顶部，图上方有标题栏。
      数据里没有任何坐标，节点位置和泳道宽度全部由自动布局计算：沿流程方向用 dagre 分层，跨泳道方向把节点放进各自的列。
      使用 <code>classic</code> 主题（蓝色实心方框、橙色判断、绿色起止、细框表格）。可以切换主题对比。
    </p>
    <div class="case__toolbar">
      <button class="case__button" id="layout-button" type="button" data-i18n="btnReAutoLayout">重新自动布局</button>
      <button class="case__button" id="fit-button" type="button" data-i18n="btnFit">适应画布</button>
      <label><span data-i18n="labelTheme"> 主题 </span><select id="theme-select">
          <option value="classic">classic</option>
          <option value="light">light</option>
          <option value="aurora">aurora</option>
          <option value="aurora-dark">aurora-dark</option>
          <option value="whiteboard">whiteboard</option>
          <option value="dark">dark</option>
          <option value="tech-blue">tech-blue</option>
          <option value="macarons">macarons</option>
        </select>
      </label>
      <label><input id="curve-toggle" type="checkbox" /><span data-i18n="labelCurveEdges"> 曲线连线</span></label>
      <label><input id="compact-toggle" type="checkbox" checked /><span data-i18n="labelCompactTop"> 紧凑泳道（每列从顶部开始）</span></label>
    </div>
    <section class="case__chart case__chart--tall" id="chart"></section>
    <script type="module" src="./swimlane-vertical.ts"></script>
  </body>
</html>
