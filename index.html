<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>echarts-flow</title>
    <link rel="stylesheet" href="./shared/site.css" />
    <script>
      // Set data-theme before first paint so dark mode never flashes light.
      (function () {
        try {
          var stored = localStorage.getItem('echarts-flow-theme');
          var dark = stored === 'dark' || (stored !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.dataset.theme = 'dark';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <header data-site-header></header>

    <header class="hero">
      <span class="hero__badge" data-i18n="heroBadge">v0.1.0 · Apache-2.0</span>
      <h1 class="hero__title">echarts-flow</h1>
      <p class="hero__tagline" data-i18n="heroTagline">基于 ECharts 6 自定义系列的可编辑流程图与泳道图扩展，原生 TypeScript，Canvas 与 SVG 双渲染。</p>
      <div class="hero__actions">
        <a class="button button--primary" href="./editor.html" data-i18n="ctaEditor">打开在线编辑器</a>
        <a class="button" href="./docs/" data-i18n="ctaDocs">阅读文档</a>
      </div>
      <div class="hero__code">
        <pre><code>npm install echarts-flow echarts</code></pre>
      </div>
      <div class="hero__chart">
        <div class="hero__chart-inner" id="hero-chart"></div>
      </div>
      <p class="hero__chart-note" data-i18n="heroChartNote">真实渲染：本图由 buildFlowOption 绘制，主题跟随页面明暗模式。</p>
    </header>

    <main class="site-main">
      <div class="card-grid" id="features"></div>
    </main>

    <footer data-site-footer></footer>

    <script type="module" src="./home.ts"></script>
  </body>
</html>
